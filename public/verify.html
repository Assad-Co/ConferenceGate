<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify a Certificate | ConferenceGate</title><meta name="description" content="Verify a ConferenceGate-issued certificate.">
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7fc;color:#14233d}header{background:white;border-bottom:1px solid #dce5f0;padding:18px max(20px,calc((100vw - 900px)/2))}header a{color:#1357b8;text-decoration:none;font-weight:700}main{max-width:620px;margin:70px auto;padding:0 20px}h1{font-size:clamp(28px,5vw,42px)}p{line-height:1.7;color:#51617a}.card{background:white;padding:32px;border:1px solid #dce5f0;border-radius:20px;box-shadow:0 10px 40px #163e7112}label{font-weight:700;display:block;margin-bottom:12px}input{width:100%;box-sizing:border-box;padding:15px;border:1px solid #b8c9df;border-radius:10px;font-size:16px}button{margin-top:16px;background:#125bbf;color:white;border:0;border-radius:10px;padding:14px 25px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.result{margin-top:24px;border-radius:12px;padding:20px;background:#f2f6fc;overflow-wrap:anywhere}.good{background:#e8f8ef;color:#155b36}.bad{background:#fff0f0;color:#8c2424}dl{display:grid;grid-template-columns:130px 1fr;gap:12px}dt{font-weight:700}dd{margin:0}@media(max-width:520px){dl{grid-template-columns:1fr;gap:3px}.card{padding:22px}}</style></head>
<body><header><a href="/">← ConferenceGate</a></header><main><h1>Certificate verification</h1><p>Check whether an abstract acceptance certificate was issued by ConferenceGate and remains valid.</p>
<section class="card"><form id="form"><label for="certificateId">Certificate ID</label><input id="certificateId" autocomplete="off" required placeholder="CG-AA-..." maxlength="38"><button id="submit" type="submit">Verify certificate</button></form><div id="result" aria-live="polite"></div></section><p>Server-issued abstract acceptance, reviewer recognition, and Technical Committee service certificates can be verified here.</p></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('certificateId'),result=document.getElementById('result'),button=document.getElementById('submit');
const query=new URLSearchParams(location.search).get('id');if(query)input.value=query;
function show(text,cls){result.className='result '+cls;result.replaceChildren();const p=document.createElement('p');p.textContent=text;result.append(p)}
form.addEventListener('submit',async(e)=>{e.preventDefault();const id=input.value.trim().toUpperCase();if(!/^CG-(?:AA|RV|TC)-[A-F0-9]{32}$/.test(id)){show('Invalid certificate ID format.','bad');return}button.disabled=true;show('Checking certificate...','');try{const response=await fetch('/api/certificates/verify/'+encodeURIComponent(id));const data=await response.json();if(!response.ok||!data.valid){show(data.revoked?'This certificate has been revoked.':'Certificate not found or not valid.','bad');return}show('Valid ConferenceGate-issued certificate','good');const dl=document.createElement('dl');for(const [key,value] of [['Certificate ID',data.certificate.id],['Recipient',data.certificate.recipientName],['Conference',data.certificate.conferenceTitle],['Abstract',data.certificate.paperTitle],['Issued',data.certificate.issuedAt]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=key;dd.textContent=value||'—';dl.append(dt,dd)}result.append(dl)}catch{show('Verification service unavailable. Please try again.','bad')}finally{button.disabled=false}});
if(query)form.requestSubmit();
</script></body></html>
