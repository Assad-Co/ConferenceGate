name: Phase 12 Canonicalize LinkedIn Maintenance

on:
  push:
    branches: [phase-12-canonical-maintenance]
    paths:
      - '.github/workflows/phase-12-canonicalize-linkedin-maintenance.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-canonical-maintenance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonicalize the legacy deep-evidence maintenance script
        run: |
          node scripts/fixLinkedInDeepEvidenceSyntax.mjs
          node --check scripts/patchLinkedInDeepEvidence.mjs
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const old = 'node scripts/fixLinkedInDeepEvidenceSyntax.mjs && ';
          if (!p.scripts?.['maintenance:legacy-patches']?.includes(old)) throw new Error('maintenance fixer command not found');
          p.scripts['maintenance:legacy-patches'] = p.scripts['maintenance:legacy-patches'].replace(old, '');
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          git rm scripts/fixLinkedInDeepEvidenceSyntax.mjs
      - name: Verify no syntax-repair dependency remains
        run: |
          node --check scripts/patchLinkedInDeepEvidence.mjs
          ! grep -q "fixLinkedInDeepEvidenceSyntax" package.json
      - name: Commit canonical maintenance source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json scripts/patchLinkedInDeepEvidence.mjs scripts/fixLinkedInDeepEvidenceSyntax.mjs
          git commit -m "Phase 12 — Make LinkedIn deep-evidence maintenance source canonical"
          git push origin HEAD:phase-12-canonical-maintenance
