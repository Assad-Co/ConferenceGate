name: Phase 36 Portal Polish

on:
  push:
    branches:
      - phase-36-organizer-import-reliability

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase36-polish-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install
        run: npm ci
      - name: Apply portal polish
        run: node scripts/phase36PortalPolish.mjs
      - name: Verify requested UX wiring
        run: |
          grep -q "Organizer Requests" src/components/SponsorPortal.tsx
          grep -q "Sponsor Wizard" src/components/SponsorPortal.tsx
          grep -q "bg-blue-50 text-blue-800 border-blue-200" src/components/SponsorPortal.tsx
          grep -q "OrganizerReviewMaterials" src/components/OrganizerDashboard.tsx
          grep -q "Review material available" server/professionalTrust.ts
          ! grep -q "Publish What You Want to Sponsor" src/components/SponsorPortal.tsx
          ! grep -q "Open Sponsor Request" src/components/SponsorWizardPanel.tsx
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/phase36PortalPolish.mjs .github/workflows/phase36-portal-polish.yml
          git add -A
          git commit -m "Phase 36 — sponsor and reviewer workflow polish [phase36-polish-integrated]"
          git push
