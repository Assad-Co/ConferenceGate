name: Phase 55 Organizer Identity

on:
  push:
    branches:
      - phase-55-sponsor-marketplace-search-filters

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase55-organizer-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-55-sponsor-marketplace-search-filters
      - name: Apply organizer identity patch
        run: python scripts/phase55_sponsor_organizer_name_patch.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/sponsors.ts src/api/sponsors.ts src/components/SponsorPortal.tsx
          git commit -m "Phase 55 — Show organizer identity in Sponsor Marketplace [phase55-organizer-applied]"
          git push
