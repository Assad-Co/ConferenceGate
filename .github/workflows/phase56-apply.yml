name: Phase 56 Apply

on:
  push:
    branches:
      - phase-56-global-discovery-depth-wpc-riyadh

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase56-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-56-global-discovery-depth-wpc-riyadh
      - name: Apply guarded discovery patch
        run: python scripts/phase56_global_discovery_patch.py
      - name: Validate JSON and source syntax
        run: |
          python -m json.tool data/phase52-major-conference-expansion.json >/dev/null
          node --check scripts/seedPopularCategoryHardCrawl.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase52-major-conference-expansion.json scripts/seedPopularCategoryHardCrawl.mjs server/discovery/sources.seed.ts
          git commit -m "Phase 56 — Deepen global discovery and add WPC Riyadh [phase56-applied]"
          git push
