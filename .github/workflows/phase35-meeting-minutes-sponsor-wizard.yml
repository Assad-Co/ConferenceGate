name: Phase 35 Integration

on:
  push:
    branches:
      - phase-35-meeting-minutes-sponsor-wizard

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase35-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install
        run: npm ci
      - name: Apply Phase 35 patches
        run: |
          sed -i 's/Sponsor Pro matching preferences/Sponsor Pro sponsor wizard profile/' scripts/phase35MeetingMinutesSponsorWizard.mjs
          node scripts/phase35MeetingMinutesSponsorWizard.mjs
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/phase35MeetingMinutesSponsorWizard.mjs .github/workflows/phase35-meeting-minutes-sponsor-wizard.yml
          git add -A
          git commit -m "Phase 35 — meeting minutes and sponsor workflows [phase35-integrated]"
          git push
