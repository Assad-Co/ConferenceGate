name: Phase 28 Conference Depth Expansion

on:
  push:
    branches:
      - phase-28-conference-depth-expansion

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-28-conference-depth-expansion
          fetch-depth: 0

      - name: Apply Phase 28 patch
        run: python scripts/phase28_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Conference depth audit script smoke
        run: node scripts/auditConferenceDepth.mjs

      - name: Commit Phase 28 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/braveSearch.ts scripts/runBackgroundBootstrap.mjs scripts/syncRequestedCategoryExpansion.mjs scripts/auditConferenceDepth.mjs package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No Phase 28 changes to commit"
          else
            git commit -m "Phase 28 — Expand upcoming conference depth and catalogue quality"
            git push origin HEAD:phase-28-conference-depth-expansion
          fi
