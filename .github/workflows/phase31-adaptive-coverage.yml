name: Phase 31 Adaptive Coverage Validation

on:
  push:
    branches:
      - phase-31-adaptive-production-coverage

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Adaptive script syntax
        run: node --check scripts/adaptiveCoverageExecution.mjs
      - name: Automation entry syntax
        run: node --check scripts/automationEntry.mjs
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
