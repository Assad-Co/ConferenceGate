name: Live Three-Account Customer Journey Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/live-customer-journey-acceptance.yml
      - scripts/verifyLiveThreeAccountAccess.mjs

permissions:
  contents: read

jobs:
  validate-live-customer-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run live Professional, Organizer, and Sponsor acceptance
        env:
          PHASE11_BASE_URL: https://conferencegate.onrender.com
        run: node scripts/verifyLiveThreeAccountAccess.mjs
