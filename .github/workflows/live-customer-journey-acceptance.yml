name: Live Three-Account Customer Journey Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-customer-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live Professional, Organizer, and Sponsor acceptance
        env:
          PHASE11_BASE_URL: https://conferencegate.onrender.com
        run: node scripts/verifyLiveThreeAccountAccess.mjs
