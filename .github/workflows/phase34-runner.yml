name: Phase 34 Professional Reviewer Integration

on:
  push:
    branches: [phase-34-professional-reviewer-workflows]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-34-professional-reviewer-workflows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply integrated Phase 34 patch
        run: python3 .github/phase34_patch.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Production build
        run: npm run build
      - name: Core activity smoke
        run: node scripts/smokeBuiltServer.mjs
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/phase34_patch.py .github/workflows/phase34-runner.yml
          git add server.ts server/activity.ts server/workspaces.ts server/professionalTrust.ts src/api/activity.ts src/App.tsx src/components/AbstractSubmissionModal.tsx src/components/ReviewerPortal.tsx src/components/OrganizerDashboard.tsx src/components/UserProfileView.tsx src/components/CertificatesView.tsx src/components/Footer.tsx
          git commit -m "Phase 34 — integrate professional reviewer workflows"
          git push origin HEAD:phase-34-professional-reviewer-workflows
