name: Messaging Notifications and Device Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/verifyCommunicationsBrowser.mjs
      - .github/workflows/communications-validation.yml
      - src/components/MessagesPanel.tsx
      - src/components/ProfileNotifications.tsx
      - src/App.tsx
      - src/api/messages.ts
      - src/api/activity.ts
      - server/messages.ts
      - server/activity.ts
      - server/db.ts
      - server.ts

permissions:
  contents: read

jobs:
  communication-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and typecheck
        run: npm run build && npx tsc -p tsconfig.check.json --noEmit
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Isolated notifications, messages, privacy and device journeys
        run: node scripts/verifyCommunicationsBrowser.mjs
      - name: Wait for production release
        env:
          PHASE11_BASE_URL: https://conferencegate.onrender.com
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            if node scripts/verifyLiveLaunch.mjs; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Live synthetic-account message and device journeys
        env:
          COMMUNICATIONS_BASE_URL: https://conferencegate.onrender.com
        run: node scripts/verifyCommunicationsBrowser.mjs
      - name: Save screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communications-device-validation
          path: communications-validation/
          retention-days: 14
