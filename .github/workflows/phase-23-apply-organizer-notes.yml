name: Phase 23 Apply Organizer Coordination Notes

on:
  push:
    branches: [phase-23-persist-organizer-notes]
    paths:
      - 'scripts/patchPhase23PersistOrganizerNotes.py'
      - '.github/workflows/phase-23-apply-organizer-notes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-23-persist-organizer-notes
      - name: Apply Phase 23 patch
        run: python scripts/patchPhase23PersistOrganizerNotes.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/activity.ts src/api/activity.ts src/components/OrganizerDashboard.tsx scripts/smokeWorkspaceSeats.mjs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Phase 23 — Persist organizer coordination notes"
            git push origin HEAD:phase-23-persist-organizer-notes
          fi
