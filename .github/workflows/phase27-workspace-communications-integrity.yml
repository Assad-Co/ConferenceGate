name: Phase 27 Workspace Communications Integrity

on:
  push:
    branches:
      - phase-27-workspace-communications-integrity

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 27 patch
        run: python scripts/phase27_workspace_messages_integrity.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit Phase 27 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MessagesPanel.tsx src/components/WorkspaceTeamPanel.tsx src/api/workspaces.ts src/App.tsx
          git commit -m "Phase 27 — Harden workspace and communications actions"
          git push
