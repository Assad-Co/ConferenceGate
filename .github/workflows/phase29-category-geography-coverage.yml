name: Phase 29 Category Geography Coverage

on:
  push:
    branches:
      - phase-29-category-geography-coverage

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-29-category-geography-coverage
          fetch-depth: 0

      - name: Apply Phase 29 patch
        run: |
          python scripts/phase29_patch.py
          python scripts/phase29_schema_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Targeted search-plan smoke
        run: >-
          npx tsx -e "import { planSearchQueries } from './server/discovery/providers/searchProvider.ts';
          const q=planSearchQueries({targetYears:[2026,2027],maxQueries:8,targets:[{subject:'Energy & Geosciences',region:'Middle East',year:2027},{subject:'Healthcare',region:'Africa',year:2027}]});
          if(q.length!==8) throw new Error('expected 8 queries');
          if(q.some(x=>!['Middle East','Africa'].includes(x.region))) throw new Error('non-target region leaked into plan');
          console.log(JSON.stringify(q.map(x=>({subject:x.subject,region:x.region,country:x.country,year:x.year}))));"

      - name: Prepare local smoke database
        run: npm run database:prepare

      - name: Coverage planner local smoke
        run: npm run discovery -- coverage-plan --years 2026,2027 --top 5 --allow-local-db

      - name: Commit Phase 29 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/discovery/coveragePlanner.ts server/discovery/providers/searchProvider.ts server/discovery/pipeline.ts server/discovery/cli.ts
          if git diff --cached --quiet; then
            echo "No Phase 29 changes to commit"
          else
            git commit -m "Phase 29 — Target category and geography coverage gaps"
            git push origin HEAD:phase-29-category-geography-coverage
          fi
