name: Phase 12 Authenticity Hardening

on:
  push:
    branches: [phase-12-authenticity-hardening]
    paths:
      - '.github/workflows/phase-12-authenticity-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-authenticity-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply authenticity hardening
        run: node scripts/phase12AuthenticityPatch.mjs
      - name: Validate production source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Phase 12 — Remove fabricated conference and submission fallbacks"
          git push origin HEAD:phase-12-authenticity-hardening
