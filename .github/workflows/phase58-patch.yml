name: Phase 58 Patch Conference Import

on: push

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase58-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-58-conference-import-prefill
          fetch-depth: 0
      - name: Apply patch
        run: python tools/phase58_patch.py
      - name: Commit patch
        run: |
          git config user.name "ConferenceGate Automation"
          git config user.email "actions@conferencegate.local"
          git add server/workspaces.ts
          git commit -m "Fix organizer conference import authorization [phase58-patched]"
          git push origin HEAD:phase-58-conference-import-prefill
