name: Phase 13 Fix Globe Import

on:
  push:
    branches: [phase-13-product-depth-and-catalogue]
    paths:
      - 'scripts/patchPhase13GlobeImport.mjs'
      - '.github/workflows/phase-13-fix-globe-import.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-13-product-depth-and-catalogue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patchPhase13GlobeImport.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeLanding.tsx
          git commit -m "Phase 13 — Fix Action Center globe import"
          git push origin HEAD:phase-13-product-depth-and-catalogue
