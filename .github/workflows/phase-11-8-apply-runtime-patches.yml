name: Phase 11.8 Remove Runtime Patcher

on:
  push:
    branches: [phase-11-8-deterministic-runtime]
    paths:
      - '.github/workflows/phase-11-8-apply-runtime-patches.yml'

permissions:
  contents: write

jobs:
  remove-runtime-patcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-11-8-deterministic-runtime
      - name: Remove install-time source mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['postinstall'] = 'node scripts/installBrowser.mjs'
          p.write_text(json.dumps(data, indent=2) + '\n')
          Path('scripts/patchOwnerPasswordRecoveryKey.mjs').unlink()
          Path('.github/workflows/phase-11-8-apply-runtime-patches.yml').unlink()
          PY
      - name: Commit deterministic runtime cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 11.8 — Remove install-time runtime source patcher"
          git push origin HEAD:phase-11-8-deterministic-runtime
