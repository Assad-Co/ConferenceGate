name: Phase 51 Sitewide Cleanup

on:
  push:
    branches:
      - phase-51-sitewide-ux-content-cleanup

permissions:
  contents: write

jobs:
  patch-phase51:
    if: ${{ !contains(github.event.head_commit.message, '[phase51-source]') && !contains(github.event.head_commit.message, '[phase51-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-51-sitewide-ux-content-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded Phase 51 cleanup
        run: python scripts/phase51_sitewide_cleanup.py
      - name: Commit shipping source changes
        run: |
          git config user.name "ConferenceGate Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/LegacyNavbar.tsx src/components/UserProfileView.tsx src/components/ReviewerPortal.tsx src/components/OrganizerDashboard.tsx
          git diff --cached --quiet && exit 1
          git commit -m "Phase 51: remove repeated content and dull actions [phase51-source]"
          git push origin HEAD:phase-51-sitewide-ux-content-cleanup
