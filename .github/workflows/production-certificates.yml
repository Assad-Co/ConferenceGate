name: Production certificate smoke test
on:
  workflow_dispatch:
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production certificate endpoints
        env:
          CONFERENCEGATE_BASE_URL: https://www.conferencegate.com
        run: node scripts/smokeCertificates.mjs
