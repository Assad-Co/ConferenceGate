name: Phase 48 Attendance UI Retry

on:
  push:
    branches:
      - phase-48-attendance-and-organizer-rating

permissions:
  contents: write

jobs:
  patch-attendance-ui:
    if: ${{ !contains(github.event.head_commit.message, '[phase48-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-48-attendance-and-organizer-rating
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Narrow the UserProfileView App anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase48_attendance_ui_patch.py')
          text = p.read_text()
          old = '''    """            registrations={registrations}\\n            conferences={discoverConferences}\\n""",\n    """            registrations={registrations}\\n            attendanceRecords={conferenceAttendance}\\n            conferences={discoverConferences}\\n""",'''
          new = '''    """            posts={posts}\\n            registrations={registrations}\\n            conferences={discoverConferences}\\n""",\n    """            posts={posts}\\n            registrations={registrations}\\n            attendanceRecords={conferenceAttendance}\\n            conferences={discoverConferences}\\n""",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ambiguous App replacement to narrow, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply guarded attendance UI patch
        run: python scripts/phase48_attendance_ui_patch.py
      - name: Commit transformed sources
        run: |
          git config user.name "ConferenceGate Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server/activity.ts src/App.tsx src/components/ConferenceDetail.tsx src/components/ExternalConferenceDetail.tsx src/components/UserProfileView.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Phase 48: connect attended conferences to account history and organizer ratings [phase48-ui]"
          git push origin HEAD:phase-48-attendance-and-organizer-rating
