name: Phase 47 Deep Role Integration

on:
  push:
    branches:
      - phase-47-deep-professional-role-research

permissions:
  contents: write

jobs:
  patch-role-research:
    if: ${{ !contains(github.event.head_commit.message, '[phase47-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-47-deep-professional-role-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded Phase 47 integration
        run: python scripts/phase47_deep_role_patch.py
      - name: Commit transformed sources
        run: |
          git config user.name "ConferenceGate Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server/professionalEvidenceResearchBootstrap.ts src/components/UserProfileView.tsx src/components/ProfessionalDeepResearchPanel.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Phase 47: integrate deep professional role research [phase47-patch]"
          git push origin HEAD:phase-47-deep-professional-role-research
