name: Phase 14 Fix Detail Order

on:
  push:
    branches: [phase-14-discovery-decision-tools]
    paths:
      - 'scripts/fixPhase14DetailOrder.mjs'
      - '.github/workflows/phase-14-fix-detail-order.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14-discovery-decision-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fixPhase14DetailOrder.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ExternalConferenceDetail.tsx
          git commit -m "Phase 14 — Fix conference detail derived-state order"
          git push origin HEAD:phase-14-discovery-decision-tools
