name: Phase 12.1 UX Depth Patch

on:
  push:
    branches: [phase-12-1-empty-state-depth]
    paths:
      - '.github/workflows/phase-12-1-ux-depth-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-1-empty-state-depth
      - name: Apply actionable empty states
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, before, after, label) {
            let source = fs.readFileSync(file, 'utf8');
            if (source.includes(after)) {
              console.log(`[phase12.1] ${label} already applied`);
              return;
            }
            const hits = source.split(before).length - 1;
            if (hits !== 1) throw new Error(`[phase12.1] ${label}: expected one anchor, found ${hits}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
            console.log(`[phase12.1] applied ${label}`);
          }

          function replaceRegexOnce(file, pattern, replacement, marker, label) {
            let source = fs.readFileSync(file, 'utf8');
            if (source.includes(marker)) {
              console.log(`[phase12.1] ${label} already applied`);
              return;
            }
            const matches = source.match(pattern) || [];
            if (matches.length !== 1) throw new Error(`[phase12.1] ${label}: expected one match, found ${matches.length}`);
            source = source.replace(pattern, replacement);
            fs.writeFileSync(file, source);
            console.log(`[phase12.1] applied ${label}`);
          }

          replaceOnce(
            'src/components/HomeLanding.tsx',
            `          <div className="divide-y divide-slate-100">\n            {upcomingDeadlines.map((conf) => (`,
            `          <div className="divide-y divide-slate-100">\n            {upcomingDeadlines.length === 0 ? (\n              <div className="px-4 py-5 text-center space-y-2">\n                <Clock className="w-5 h-5 text-slate-300 mx-auto" />\n                <p className="text-[11px] text-slate-500">No upcoming abstract deadlines in your current feed.</p>\n                <button type="button" onClick={() => exploreField('Open call for papers')} className="text-[11px] font-bold text-blue-700 hover:text-blue-900">Find open CFPs</button>\n              </div>\n            ) : upcomingDeadlines.map((conf) => (`,
            'home deadline fallback'
          );
          replaceOnce(
            'src/components/HomeLanding.tsx',
            `            ))}\n          </div>\n          <button\n            onClick={() => onNavigateTab('discover')}\n            className="w-full text-center text-xs font-bold text-slate-500 hover:text-blue-600 py-2.5 border-t border-slate-100 cursor-pointer"\n          >\n            Show more\n          </button>`,
            `            ))}\n          </div>\n          <button\n            onClick={() => onNavigateTab('discover')}\n            className="w-full text-center text-xs font-bold text-slate-500 hover:text-blue-600 py-2.5 border-t border-slate-100 cursor-pointer"\n          >\n            {upcomingDeadlines.length === 0 ? 'Browse calls for papers' : 'Show more'}\n          </button>`,
            'home deadline footer action'
          );
          replaceOnce(
            'src/components/HomeLanding.tsx',
            `          <div className="divide-y divide-slate-100">\n            {upcomingConferences.map((conf) => (`,
            `          <div className="divide-y divide-slate-100">\n            {upcomingConferences.length === 0 ? (\n              <div className="px-4 py-5 text-center space-y-2">\n                <Calendar className="w-5 h-5 text-slate-300 mx-auto" />\n                <p className="text-[11px] text-slate-500">Your followed-conference list is quiet.</p>\n                <button type="button" onClick={() => onNavigateTab('discover')} className="text-[11px] font-bold text-blue-700 hover:text-blue-900">Browse worldwide conferences</button>\n              </div>\n            ) : upcomingConferences.map((conf) => (`,
            'home upcoming conferences fallback'
          );

          replaceOnce(
            'src/components/ReviewerPortal.tsx',
            `                <p className="text-xs text-slate-500 mt-1">\n                  Try a different search term or check again when organizers publish new calls for reviewers.\n                </p>\n              </div>`,
            `                <p className="text-xs text-slate-500 mt-1">\n                  Try a different search term or check again when organizers publish new calls for reviewers.\n                </p>\n                <div className="flex flex-wrap justify-center gap-2 mt-4">\n                  {opportunitySearch.trim() && (\n                    <button type="button" onClick={() => setOpportunitySearch('')} className="px-3.5 py-2 rounded-full border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50">Clear search</button>\n                  )}\n                  <button type="button" onClick={() => setRoleFilter('recommended')} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Show recommendations</button>\n                </div>\n              </div>`,
            'reviewer empty search actions'
          );
          replaceOnce(
            'src/components/ReviewerPortal.tsx',
            `                <p className="text-xs text-slate-500 mt-1 max-w-xl mx-auto">\n                  ConferenceGate will show a role here only after an organizer explicitly publishes that opening.\n                </p>\n              </div>`,
            `                <p className="text-xs text-slate-500 mt-1 max-w-xl mx-auto">\n                  ConferenceGate will show a role here only after an organizer explicitly publishes that opening.\n                </p>\n                <button type="button" onClick={() => setRoleFilter('recommended')} className="mt-4 px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">View all recommendations</button>\n              </div>`,
            'professional role empty action'
          );
          replaceOnce(
            'src/components/ReviewerPortal.tsx',
            `                <p className="text-xs text-slate-500 mt-1 max-w-xl mx-auto">\n                  Complete your expertise and availability profile, or check the individual role tabs to see all organizer-published openings.\n                </p>\n              </div>`,
            `                <p className="text-xs text-slate-500 mt-1 max-w-xl mx-auto">\n                  Complete your expertise and availability profile, or check the individual role tabs to see all organizer-published openings.\n                </p>\n                <div className="flex flex-wrap justify-center gap-2 mt-4">\n                  <button type="button" onClick={() => { setOpportunitySearch(''); setRoleFilter('reviewer'); }} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Show reviewer calls</button>\n                  {!availableToReview && (\n                    <button type="button" onClick={onToggleAvailability} className="px-3.5 py-2 rounded-full border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-bold hover:bg-emerald-100">Turn on reviewer availability</button>\n                  )}\n                </div>\n              </div>`,
            'recommended opportunities empty actions'
          );
          replaceOnce(
            'src/components/ReviewerPortal.tsx',
            `      {activeTab === 'evaluate' && !selectedSub && (\n        <div className="p-6 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-400 font-medium">\n          No abstract is currently assigned to you for review. Once an organizer invites you to review a paper, it'll show up here and in Review Opportunities.\n        </div>\n      )}`,
            `      {activeTab === 'evaluate' && !selectedSub && (\n        <div className="p-6 bg-white rounded-2xl border border-slate-200 text-center space-y-3">\n          <p className="text-xs text-slate-500 font-medium">No abstract is currently assigned to you for review. Once an organizer invites you to review a paper, it'll show up here and in Review Opportunities.</p>\n          <button type="button" onClick={() => setActiveTab('opportunities')} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Browse professional opportunities</button>\n        </div>\n      )}`,
            'evaluate tab empty action'
          );

          replaceRegexOnce(
            'src/components/OrganizerDashboard.tsx',
            /No abstract submissions yet for your conferences\./g,
            `<div className="space-y-3">\n                          <p className="text-xs text-slate-500 font-medium">No abstract submissions yet for your conferences.</p>\n                          <button type="button" onClick={() => setActiveTab('wizard')} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Open Conference Wizard</button>\n                        </div>`,
            'Open Conference Wizard',
            'organizer abstracts empty action'
          );
          replaceRegexOnce(
            'src/components/OrganizerDashboard.tsx',
            /No technical committee members yet\. Nominate candidates above or add members via the Conference\s+Wizard\./g,
            `<div className="space-y-3">\n                    <p className="text-xs text-slate-500 font-medium">No technical committee members yet. Nominate candidates above or add members via the Conference Wizard.</p>\n                    <div className="flex flex-wrap justify-center gap-2">\n                      <button type="button" onClick={() => setActiveTab('professionals')} className="px-3.5 py-2 rounded-full border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50">Search professionals</button>\n                      <button type="button" onClick={() => setActiveTab('wizard')} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Open Conference Wizard</button>\n                    </div>\n                  </div>`,
            'Search professionals',
            'committee roster empty actions'
          );
          replaceRegexOnce(
            'src/components/OrganizerDashboard.tsx',
            /No sponsorship packages published yet\./g,
            `<div className="space-y-3">\n                  <p className="text-xs text-slate-500 font-medium">No sponsorship packages published yet.</p>\n                  <button type="button" onClick={() => setActiveTab('sponsors')} className="px-3.5 py-2 rounded-full bg-blue-900 hover:bg-blue-950 text-white text-xs font-bold">Build sponsor inventory</button>\n                </div>`,
            'Build sponsor inventory',
            'organizer sponsorship analytics action'
          );
          NODE
      - name: Commit Phase 12.1 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeLanding.tsx src/components/ReviewerPortal.tsx src/components/OrganizerDashboard.tsx
          if git diff --cached --quiet; then
            echo "No Phase 12.1 source changes to commit."
          else
            git commit -m "Phase 12.1 — Make empty states actionable"
            git push origin HEAD:phase-12-1-empty-state-depth
          fi
