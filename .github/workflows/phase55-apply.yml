name: Phase 55 Apply

on:
  push:
    branches:
      - phase-55-sponsor-marketplace-search-filters

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase55-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-55-sponsor-marketplace-search-filters
      - name: Apply guarded patch
        run: python scripts/phase55_sponsor_marketplace_patch.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SponsorPortal.tsx
          git commit -m "Phase 55 — Sponsor marketplace search and organizer demand [phase55-applied]"
          git push
