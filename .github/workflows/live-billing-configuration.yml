name: Live Billing Configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verifyLiveBillingConfiguration.mjs'
      - '.github/workflows/live-billing-configuration.yml'

permissions:
  contents: read

jobs:
  probe-live-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live billing configuration safely
        env:
          PHASE116_BASE_URL: https://conferencegate.onrender.com
        run: node scripts/verifyLiveBillingConfiguration.mjs
