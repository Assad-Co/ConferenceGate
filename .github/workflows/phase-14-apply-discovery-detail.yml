name: Phase 14 Apply Discovery Detail Hardening

on:
  push:
    branches: [phase-14-discovery-detail-hardening]
    paths:
      - 'scripts/patchPhase14DiscoveryDetail.mjs'
      - '.github/workflows/phase-14-apply-discovery-detail.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14-discovery-detail-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 14 patch
        run: node scripts/patchPhase14DiscoveryDetail.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ConferenceDetail.tsx src/components/DiscoveryEngine.tsx
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Phase 14 — Make discovery and conference details more trustworthy and actionable"
            git push origin HEAD:phase-14-discovery-detail-hardening
          fi
