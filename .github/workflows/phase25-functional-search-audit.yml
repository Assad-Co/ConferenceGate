name: Phase 25 Functional Search Audit

on:
  push:
    branches:
      - phase-25-functional-search-audit
    paths:
      - scripts/phase25_functional_search_audit.py
      - .github/workflows/phase25-functional-search-audit.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-25-functional-search-audit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Phase 25 patch
        run: python3 scripts/phase25_functional_search_audit.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run typecheck --if-present

      - name: Production build
        run: npm run build

      - name: Commit Phase 25 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DiscoveryEngine.tsx src/components/ConferenceDetail.tsx
          if git diff --cached --quiet; then
            echo "No Phase 25 changes to commit."
            exit 0
          fi
          git commit -m "Phase 25 — Harden conference search and actions"
          git push origin HEAD:phase-25-functional-search-audit
