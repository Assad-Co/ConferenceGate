name: Phase 19 Apply Reviewer Neutral Scoring

on:
  push:
    branches: [phase-19-reviewer-neutral-scoring]
    paths:
      - 'scripts/patchPhase19ReviewerNeutralScoring.mjs'
      - '.github/workflows/phase-19-apply-reviewer-neutral-scoring.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-19-reviewer-neutral-scoring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 19 patch
        run: node scripts/patchPhase19ReviewerNeutralScoring.mjs
      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ReviewerPortal.tsx
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Phase 19 — Remove reviewer scoring and recommendation bias"
            git push origin HEAD:phase-19-reviewer-neutral-scoring
          fi
