name: Email delivery reliability
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  email-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated queue concurrency, retry, cooldown and privacy
        env:
          NODE_ENV: test
          TEST_DATABASE_PATH: ${{ runner.temp }}/email-delivery.db
          TURSO_DATABASE_URL: ''
          TURSO_AUTH_TOKEN: ''
        run: node --import tsx --test server/tests/intelligenceOutbox.test.ts
      - run: npm run build
      - name: Verify email logo embedding and safe branded links
        run: node --import tsx --test server/tests/emailBranding.test.ts
      - name: Verify actual isolated SMTP failure and recovery
        env:
          NODE_ENV: test
          TEST_DATABASE_PATH: ${{ runner.temp }}/smtp-recovery.db
          TURSO_DATABASE_URL: ''
          TURSO_AUTH_TOKEN: ''
        run: node --import tsx --test server/tests/smtpRecovery.test.ts
      - run: node scripts/smokeEmailDiagnostics.mjs
