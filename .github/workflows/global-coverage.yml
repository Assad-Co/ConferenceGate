name: Global coverage evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verified-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Preserve distinct workshops and verify evidence fields
        env:
          NODE_ENV: test
          TEST_DATABASE_PATH: ${{ runner.temp }}/global-coverage.db
          TURSO_DATABASE_URL: ''
          TURSO_AUTH_TOKEN: ''
        run: node --import tsx --test server/dataset/tests/globalExpansion.test.ts src/utils/__tests__/conferencePresentation.test.ts
      - run: node --import tsx scripts/auditGlobalCoverage.ts global-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-global-coverage
          path: global-coverage.json
