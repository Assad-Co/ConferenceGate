name: Phase 12 Home Global Depth

on:
  push:
    branches: [phase-12-home-global-depth]
    paths:
      - '.github/workflows/phase-12-home-global-depth.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-home-global-depth
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Home worldwide-catalogue upgrade
        run: node scripts/phase12HomeGlobalPatch.mjs
      - name: Validate production build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/HomeLanding.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Phase 12 — Bring worldwide catalogue onto Home"
            git push origin HEAD:phase-12-home-global-depth
          fi
