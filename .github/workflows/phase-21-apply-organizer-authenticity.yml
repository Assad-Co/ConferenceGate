name: Phase 21 Apply Organizer Authenticity

on:
  push:
    branches: [phase-21-organizer-authentic-actions]
    paths:
      - 'scripts/patchPhase21OrganizerAuthenticActions.py'
      - '.github/workflows/phase-21-apply-organizer-authenticity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-21-organizer-authentic-actions
      - name: Apply Phase 21 patch
        run: python scripts/patchPhase21OrganizerAuthenticActions.py
      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OrganizerDashboard.tsx
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Phase 21 — Remove simulated organizer signals"
            git push origin HEAD:phase-21-organizer-authentic-actions
          fi
