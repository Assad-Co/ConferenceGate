name: Application Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Phase 57 mega organizer registry
        run: node scripts/checkMegaOrganizerRegistry.mjs
      - name: Repair and validate rich launch catalogue
        run: node scripts/repairLaunchDatasetJson.mjs && node scripts/checkLaunchDatasetIntegrity.mjs
      - name: Prepare production UX, real-data, and global discovery patches
        run: node scripts/patchRealProductionData.mjs && node scripts/patchGlobalDiscoveryExpansion.mjs && node scripts/patchImageUploadUX.mjs && node scripts/patchSponsorEvaluationCTA.mjs && node scripts/patchProfessionalSignupOnboarding.mjs && node scripts/patchProfessionalNavigation.mjs && node scripts/patchProfessionalExperiencePolish.mjs && node scripts/patchMyConferencesSaveOnly.mjs
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Organizer alias filter regression
        run: npx tsx --test server/discovery/tests/organizerAliasFilter.test.ts
      - name: Sponsor and marketplace alert worker syntax
        run: node --check scripts/refreshSponsorWatchlistAlerts.mjs && node --check scripts/refreshMarketplaceActionAlerts.mjs
      - name: Production readiness script syntax
        run: node --check scripts/checkProductionReadiness.mjs && node --check scripts/verifyLiveLaunch.mjs && node --check scripts/prepareLocalDatabase.mjs && node --check scripts/migrateTursoToSqlite.mjs && node --check scripts/restoreLegacyProfessionalProfile.mjs && node --check scripts/reconcileLegacyProductionData.mjs && node --check scripts/reconcileLegacyProductionDataIfNeeded.mjs && node --check scripts/smokeLegacyReconcileRuntime.mjs && node --check scripts/smokeSqliteBackend.mjs && node --check scripts/smokeEphemeralSqliteBackend.mjs && node --check scripts/smokeThreeAccountJourney.mjs && node --check scripts/patchGlobalDiscoveryExpansion.mjs && node --check scripts/patchProfessionalSignupOnboarding.mjs && node --check scripts/patchProfessionalNavigation.mjs && node --check scripts/patchProfessionalExperiencePolish.mjs && node --check scripts/patchMyConferencesSaveOnly.mjs && node --check scripts/checkLaunchDatasetIntegrity.mjs && node --check scripts/checkMegaOrganizerRegistry.mjs && node --check scripts/syncMegaOrganizerRegistry.mjs && node --check scripts/megaConferenceCoverageReport.mjs && node --check scripts/runConferenceEnrichmentLoop.mjs && node --check scripts/runBackgroundBootstrap.mjs
      - name: Growth and marketplace intelligence syntax
        run: node --check scripts/growthReport.mjs && node --check scripts/growthCohortReport.mjs && node --check scripts/executiveGrowthSnapshot.mjs && node --check scripts/ensureGrowthSchema.mjs && node --check scripts/smokeGrowthReport.mjs && node --check scripts/smokeGrowthDashboard.mjs && node --check scripts/smokeGrowthAutomation.mjs && node --check scripts/smokeOwnerPreview.mjs && node --check scripts/smokeMarketplaceIntelligence.mjs && node --check scripts/smokeEnterpriseGovernance.mjs
      - name: Production build
        run: npm run build
      - name: Turso runtime database selection smoke test
        env:
          TURSO_DATABASE_URL: libsql://conferencegate-smoke.example
          TURSO_AUTH_TOKEN: smoke-token
        run: npx tsx scripts/smokeDatabaseBackendSelection.ts
      - name: Active Turso legacy reconciliation guard smoke test
        run: node scripts/smokeLegacyReconcileRuntime.mjs
      - name: Discover catalogue recovery test
        run: npx tsx --test server/discovery/tests/staticCatalogueRecovery.test.ts
      - name: SQLite backend smoke test
        run: node scripts/smokeSqliteBackend.mjs
      - name: Temporary SQLite startup smoke test
        run: node scripts/smokeEphemeralSqliteBackend.mjs
      - name: Billing webhook smoke test
        run: node scripts/smokeBillingWebhooks.mjs
      - name: Commercial lifecycle smoke test
        run: node scripts/smokeCommercialLifecycle.mjs
      - name: Three-account real user journey
        run: node scripts/smokeThreeAccountJourney.mjs
      - name: Growth and revenue operations smoke test
        run: node scripts/smokeGrowthReport.mjs
      - name: Private growth dashboard smoke test
        run: node scripts/smokeGrowthDashboard.mjs
      - name: Marketplace intelligence smoke test
        run: node scripts/smokeMarketplaceIntelligence.mjs
      - name: Customer acquisition and growth automation smoke test
        run: node scripts/smokeGrowthAutomation.mjs
      - name: Owner preview access smoke test
        run: node scripts/smokeOwnerPreview.mjs
      - name: Workspace seat inheritance smoke test
        run: node scripts/smokeWorkspaceSeats.mjs
      - name: Enterprise governance smoke test
        run: node scripts/smokeEnterpriseGovernance.mjs
      - name: Built server smoke test
        run: node scripts/smokeBuiltServer.mjs
