name: Application Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate Phase 57 mega organizer registry
        run: node scripts/checkMegaOrganizerRegistry.mjs
      - name: Always-on global discovery regression audit
        run: node scripts/checkAlwaysOnDiscovery.mjs
      - name: Repair and validate rich launch catalogue
        run: node scripts/repairLaunchDatasetJson.mjs && node scripts/checkLaunchDatasetIntegrity.mjs
      - name: Prepare production UX, real-data, and global discovery patches
        run: node scripts/patchRealProductionData.mjs && node scripts/patchGlobalDiscoveryExpansion.mjs && node scripts/patchImageUploadUX.mjs && node scripts/patchSponsorEvaluationCTA.mjs && node scripts/patchProfessionalSignupOnboarding.mjs && node scripts/patchProfessionalNavigation.mjs && node scripts/patchProfessionalExperiencePolish.mjs && node scripts/patchMyConferencesSaveOnly.mjs && node scripts/patchLinkedInDeepProfessional.mjs && node scripts/patchProfessionalControlsClarity.mjs && node scripts/patchProfessionalProfileSimplify.mjs && node scripts/patchProfessionalCommunicationReliability.mjs && node scripts/patchProfessionalFinalPolish.mjs && node scripts/patchLinkedInFullCareerHistory.mjs && node scripts/patchLinkedInCompleteProfileMerge.mjs && node scripts/patchPapersAbstractsCompleteness.mjs && node scripts/patchProfessionalFinalAcceptance.mjs && node scripts/patchHeavyProfessionalConferenceEvidence.mjs && node scripts/patchHeavyProfessionalConferenceReadStored.mjs && node scripts/patchProfessionalRoleEvidenceCounts.mjs && node scripts/patchProfessionalFinalDeclutter.mjs && node scripts/patchOrganizerFinalUX.mjs
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Professional experience regression audit
        run: node scripts/checkProfessionalExperience.mjs
      - name: LinkedIn full career history regression audit
        run: node scripts/checkLinkedInFullCareerHistory.mjs
      - name: LinkedIn complete profile merge regression audit
        run: node scripts/checkLinkedInCompleteProfileMerge.mjs
      - name: Papers and abstracts completeness regression audit
        run: node scripts/checkPapersAbstractsCompleteness.mjs
      - name: Professional final acceptance audit
        run: node scripts/checkProfessionalFinalAcceptance.mjs
      - name: Heavy Professional conference evidence audit
        run: node scripts/checkHeavyProfessionalConferenceEvidence.mjs
      - name: Professional final declutter audit
        run: node scripts/checkProfessionalFinalDeclutter.mjs
      - name: Organizer final UX and committee messaging audit
        run: node scripts/checkOrganizerFinalUX.mjs
      - name: Organizer alias filter regression
        run: npx tsx --test server/discovery/tests/organizerAliasFilter.test.ts
      - name: Sponsor and marketplace alert worker syntax
        run: node --check scripts/refreshSponsorWatchlistAlerts.mjs && node --check scripts/refreshMarketplaceActionAlerts.mjs
      - name: Production readiness script syntax
        run: node --check scripts/checkProductionReadiness.mjs && node --check scripts/verifyLiveLaunch.mjs && node --check scripts/prepareLocalDatabase.mjs && node --check scripts/migrateTursoToSqlite.mjs && node --check scripts/restoreLegacyProfessionalProfile.mjs && node --check scripts/reconcileLegacyProductionData.mjs && node --check scripts/reconcileLegacyProductionDataIfNeeded.mjs && node --check scripts/smokeLegacyReconcileRuntime.mjs && node --check scripts/smokeSqliteBackend.mjs && node --check scripts/smokeEphemeralSqliteBackend.mjs && node --check scripts/smokeThreeAccountJourney.mjs && node --check scripts/smokeProfessionalCommunications.mjs && node --check scripts/patchGlobalDiscoveryExpansion.mjs && node --check scripts/patchProfessionalSignupOnboarding.mjs && node --check scripts/patchProfessionalNavigation.mjs && node --check scripts/patchProfessionalExperiencePolish.mjs && node --check scripts/patchMyConferencesSaveOnly.mjs && node --check scripts/patchLinkedInDeepProfessional.mjs && node --check scripts/patchProfessionalControlsClarity.mjs && node --check scripts/patchProfessionalProfileSimplify.mjs && node --check scripts/patchProfessionalCommunicationReliability.mjs && node --check scripts/patchProfessionalFinalPolish.mjs && node --check scripts/patchLinkedInFullCareerHistory.mjs && node --check scripts/patchLinkedInCompleteProfileMerge.mjs && node --check scripts/patchPapersAbstractsCompleteness.mjs && node --check scripts/patchProfessionalFinalAcceptance.mjs && node --check scripts/patchHeavyProfessionalConferenceEvidence.mjs && node --check scripts/patchHeavyProfessionalConferenceReadStored.mjs && node --check scripts/patchProfessionalRoleEvidenceCounts.mjs && node --check scripts/patchProfessionalFinalDeclutter.mjs && node --check scripts/patchOrganizerFinalUX.mjs && node --check scripts/checkProfessionalExperience.mjs && node --check scripts/checkLinkedInFullCareerHistory.mjs && node --check scripts/checkLinkedInCompleteProfileMerge.mjs && node --check scripts/checkPapersAbstractsCompleteness.mjs && node --check scripts/checkProfessionalFinalAcceptance.mjs && node --check scripts/checkHeavyProfessionalConferenceEvidence.mjs && node --check scripts/checkProfessionalFinalDeclutter.mjs && node --check scripts/checkOrganizerFinalUX.mjs && node --check scripts/checkAlwaysOnDiscovery.mjs && node --check scripts/checkLaunchDatasetIntegrity.mjs && node --check scripts/checkMegaOrganizerRegistry.mjs && node --check scripts/syncMegaOrganizerRegistry.mjs && node --check scripts/megaConferenceCoverageReport.mjs && node --check scripts/runConferenceEnrichmentLoop.mjs && node --check scripts/runBackgroundBootstrap.mjs && node --check scripts/automationEntry.mjs
      - name: Growth and marketplace intelligence syntax
        run: node --check scripts/growthReport.mjs && node --check scripts/growthCohortReport.mjs && node --check scripts/executiveGrowthSnapshot.mjs && node --check scripts/ensureGrowthSchema.mjs && node --check scripts/smokeGrowthReport.mjs && node --check scripts/smokeGrowthDashboard.mjs && node --check scripts/smokeGrowthAutomation.mjs && node --check scripts/smokeOwnerPreview.mjs && node --check scripts/smokeMarketplaceIntelligence.mjs && node --check scripts/smokeEnterpriseGovernance.mjs
      - name: Production build
        run: npm run build
      - name: Validate final build-patched TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Launch readiness regressions
        run: npx tsx --test server/publicConferenceVisibility.test.ts src/utils/__tests__/conferencePresentation.test.ts
      - name: Private Organizer and Sponsor owner-access isolation
        run: node scripts/smokePrivateWorkspaces.mjs
      - name: Turso runtime database selection smoke test
        env:
          TURSO_DATABASE_URL: libsql://conferencegate-smoke.example
          TURSO_AUTH_TOKEN: smoke-token
        run: npx tsx scripts/smokeDatabaseBackendSelection.ts
      - name: Active Turso legacy reconciliation guard smoke test
        run: node scripts/smokeLegacyReconcileRuntime.mjs
      - name: Discover catalogue recovery test
        run: npx tsx --test server/discovery/tests/staticCatalogueRecovery.test.ts
      - name: SQLite backend smoke test
        run: node scripts/smokeSqliteBackend.mjs
      - name: Temporary SQLite startup smoke test
        run: node scripts/smokeEphemeralSqliteBackend.mjs
      # Billing/subscription features are deferred until the paid launch phase.
      # Keep the existing billing test scripts for a future dedicated validation workflow.
      # The three-account journey activates paid organizer/sponsor plans.
      # Defer it until the paid-access phase; preserve the script for that phase.
      # The existing communications smoke test requires activating a paid Organizer.
      # Retain it for the paid launch phase; add a free-only communications test separately.
      - name: Growth and revenue operations smoke test
        run: node scripts/smokeGrowthReport.mjs
      - name: Private growth dashboard smoke test
        run: node scripts/smokeGrowthDashboard.mjs
      - name: Marketplace intelligence smoke test
        run: node scripts/smokeMarketplaceIntelligence.mjs
      - name: Customer acquisition and growth automation smoke test
        run: node scripts/smokeGrowthAutomation.mjs
      - name: Owner preview access smoke test
        run: node scripts/smokeOwnerPreview.mjs
      - name: Workspace seat inheritance smoke test
        run: node scripts/smokeWorkspaceSeats.mjs
      - name: Enterprise governance smoke test
        run: node scripts/smokeEnterpriseGovernance.mjs
      - name: Built server smoke test
        run: node scripts/smokeBuiltServer.mjs
      - name: Free-launch signup and certificate authorization acceptance
        run: node scripts/smokeFreeLaunchAcceptance.mjs
