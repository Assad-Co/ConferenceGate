name: Application Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Sponsor watch worker syntax
        run: node --check scripts/refreshSponsorWatchlistAlerts.mjs
      - name: Production build
        run: npm run build
