name: Application Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Sponsor watch worker syntax
        run: node --check scripts/refreshSponsorWatchlistAlerts.mjs
      - name: Production readiness script syntax
        run: node --check scripts/checkProductionReadiness.mjs
      - name: Growth report syntax
        run: node --check scripts/growthReport.mjs && node --check scripts/growthCohortReport.mjs && node --check scripts/executiveGrowthSnapshot.mjs && node --check scripts/ensureGrowthSchema.mjs && node --check scripts/smokeGrowthReport.mjs && node --check scripts/smokeGrowthDashboard.mjs
      - name: Production build
        run: npm run build
      - name: Billing webhook smoke test
        run: node scripts/smokeBillingWebhooks.mjs
      - name: Commercial lifecycle smoke test
        run: node scripts/smokeCommercialLifecycle.mjs
      - name: Growth and revenue operations smoke test
        run: node scripts/smokeGrowthReport.mjs
      - name: Private growth dashboard smoke test
        run: node scripts/smokeGrowthDashboard.mjs
      - name: Workspace seat inheritance smoke test
        run: node scripts/smokeWorkspaceSeats.mjs
      - name: Built server smoke test
        run: node scripts/smokeBuiltServer.mjs
