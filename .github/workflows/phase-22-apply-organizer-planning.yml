name: Phase 22 Apply Organizer Planning Persistence

on:
  push:
    branches: [phase-22-persist-organizer-planning]
    paths:
      - 'scripts/patchPhase22PersistOrganizerPlanning.py'
      - '.github/workflows/phase-22-apply-organizer-planning.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-22-persist-organizer-planning
      - name: Apply Phase 22 patch
        run: python scripts/patchPhase22PersistOrganizerPlanning.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts server/activity.ts src/api/activity.ts src/components/OrganizerDashboard.tsx scripts/smokeWorkspaceSeats.mjs
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Phase 22 — Persist organizer tasks and meeting plans"
            git push origin HEAD:phase-22-persist-organizer-planning
          fi
