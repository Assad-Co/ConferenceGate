name: Phase 12 Apply Website Expansion

on:
  push:
    branches: [phase-12-conference-expansion-ux]
    paths:
      - '.github/workflows/phase-12-apply-website-expansion.yml'

permissions:
  contents: write

jobs:
  apply-phase-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-conference-expansion-ux
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Phase 12 website and catalogue improvements
        run: node scripts/phase12WebsiteExpansionPatch.mjs
      - name: Validate patched source
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run build
          node --check scripts/syncRequestedCategoryExpansion.mjs
      - name: Commit canonical Phase 12 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase12-verified-expansion.json scripts/syncRequestedCategoryExpansion.mjs src/App.tsx src/components/HomeLanding.tsx src/components/DiscoveryEngine.tsx
          if git diff --cached --quiet; then
            echo "No Phase 12 source changes to commit."
          else
            git commit -m "Phase 12 — Expand verified catalogue and strengthen discovery UX"
            git push origin HEAD:phase-12-conference-expansion-ux
          fi
