name: Phase 11.7 Apply Synthetic Metrics Guard

on:
  push:
    branches: [phase-11-7-synthetic-metrics-guard]
    paths:
      - 'scripts/patchPhase117SyntheticMetricsGuard.mjs'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-11-7-synthetic-metrics-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare one-time patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patchPhase117SyntheticMetricsGuard.mjs')
          text = path.read_text()
          needle = "  const count = text.split(from).length - 1;\n"
          replacement = needle + "  if ((label === 'dashboard role signups7d' || label === 'dashboard role signups30d') && expected === 1 && count === 2) {\n    return text.replace(from, to);\n  }\n"
          if needle not in text:
              raise SystemExit('patch helper marker not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Apply synthetic-customer metrics guard
        run: node scripts/patchPhase117SyntheticMetricsGuard.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/growthDashboard.ts server/discovery/router.ts scripts/growthCohortReport.mjs scripts/growthReport.mjs scripts/smokeGrowthDashboard.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Phase 11.7 — Exclude synthetic acceptance accounts from customer metrics"
            git push origin HEAD:phase-11-7-synthetic-metrics-guard
          fi
