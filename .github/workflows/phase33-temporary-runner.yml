name: Phase 33 Temporary Runner

on:
  push:
    branches: [phase-33-production-intelligence]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-33-production-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Phase 33 wiring
        run: python3 .github/phase33_patch.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Build
        run: npm run build
      - name: Growth dashboard smoke
        run: node scripts/smokeGrowthDashboard.mjs
      - name: Commit validated Phase 33 branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/phase33_patch.py .github/workflows/phase33-runner.yml .github/workflows/phase33-production-intelligence-patch.yml
          git add server/growthDashboard.ts public/growth.html scripts/smokeGrowthDashboard.mjs
          git commit -m "Phase 33 — wire source ROI into private dashboard"
          git push origin HEAD:phase-33-production-intelligence
