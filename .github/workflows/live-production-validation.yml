name: Live Production Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Render and validate deployed release
        env:
          PHASE11_BASE_URL: https://conferencegate.onrender.com
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 36); do
            echo "Production validation attempt ${attempt}/36"
            if node scripts/verifyLiveLaunch.mjs; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become launch-ready for commit ${GITHUB_SHA} within the validation window."
          exit 1

      - name: Organizer conference import route smoke test
        env:
          CONFERENCEGATE_BASE_URL: https://conferencegate.onrender.com
        run: node scripts/smokeOrganizerImportApi.mjs
