name: Phase 15 Fix Conference Tag Literal

on:
  push:
    branches: [phase-15-community-utility]
    paths:
      - 'scripts/fixPhase15ConferenceTagLiteral.mjs'
      - '.github/workflows/phase-15-fix-conference-tag-literal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-15-community-utility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fixPhase15ConferenceTagLiteral.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CommunityFeed.tsx
          git commit -m "Phase 15 — Fix Community conference tag literal"
          git push origin HEAD:phase-15-community-utility
