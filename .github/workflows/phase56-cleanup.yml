name: Phase 56 Cleanup

on:
  push:
    branches:
      - phase-56-global-discovery-depth-wpc-riyadh

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[phase56-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-56-global-discovery-depth-wpc-riyadh
          fetch-depth: 0
      - name: Restore old manifest and create Phase 56 manifest
        run: python scripts/phase56_manifest_cleanup.py
      - name: Validate manifests and sync syntax
        run: |
          python -m json.tool data/phase52-major-conference-expansion.json >/dev/null
          python -m json.tool data/phase56-global-major-conferences.json >/dev/null
          node --check scripts/syncPhase52MajorConferences.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phase52-major-conference-expansion.json data/phase56-global-major-conferences.json scripts/syncPhase52MajorConferences.mjs
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Phase 56 — Isolate WPC into global major-conference manifest [phase56-cleaned]"
          git push
