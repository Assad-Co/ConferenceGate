name: Phase 30 Coverage Gap Closure

on:
  push:
    branches:
      - phase-30-coverage-gap-closure

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-30-coverage-gap-closure
          fetch-depth: 0

      - name: Apply Phase 30 integration patch
        run: python scripts/phase30_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Coverage progress smoke
        run: >-
          npx tsx -e "import { coverageProgress } from './server/discovery/coverageClosure.ts';
          const before={coveredCells:10,cells:100,accepted:20,publishReady:8,richPublished:5,remainingGapUnits:30};
          const after={coveredCells:12,cells:100,accepted:23,publishReady:10,richPublished:7,remainingGapUnits:26};
          const p=coverageProgress(before,after,3);
          if(!p.moved||p.coveredCellsDelta!==2||p.acceptedDelta!==3||p.publishReadyDelta!==2||p.richPublishedDelta!==2||p.gapUnitsClosed!==4||p.deepSectionsFilled!==3) throw new Error('coverage progress accounting failed');
          console.log(JSON.stringify(p));"

      - name: Local coverage planner smoke
        run: |
          npm run database:prepare
          npm run discovery -- coverage-plan --years 2026,2027 --top 5 --allow-local-db

      - name: Commit Phase 30 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/discovery/coverageClosure.ts server/discovery/enrichment.ts server/discovery/publish.ts server/discovery/cli.ts
          if git diff --cached --quiet; then
            echo "No Phase 30 production changes to commit"
          else
            git commit -m "Phase 30 — Automate coverage gap closure and quality promotion"
            git push origin HEAD:phase-30-coverage-gap-closure
          fi
