name: Phase 54 TypeScript Fix

on:
  push:
    branches:
      - phase-54-search-filters-import-reliability

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[phase54-ts-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove duplicate declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/linkedinProfileBootstrap.ts')
          s = p.read_text()
          old = '''  const requestedSlug = profileSlug(requestedUrl);\n  const returnedUrl = normalizeLinkedInProfileUrl(profile.linkedinUrl) || requestedUrl;'''
          new = '''  const returnedUrl = normalizeLinkedInProfileUrl(profile.linkedinUrl) || requestedUrl;'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one duplicate declaration block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/linkedinProfileBootstrap.ts
          git commit -m "Fix Phase 54 LinkedIn import variable reuse [phase54-ts-fixed]"
          git push
