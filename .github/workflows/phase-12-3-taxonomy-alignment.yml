name: Phase 12.3 Taxonomy Alignment

on:
  push:
    branches: [phase-12-2-community-author-depth]
    paths:
      - '.github/workflows/phase-12-3-taxonomy-alignment.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-2-community-author-depth
      - name: Align harvested and customer-facing conference categories
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, before, after, label) {
            let source = fs.readFileSync(file, 'utf8');
            if (source.includes(after)) {
              console.log(`[phase12.3] ${label} already applied`);
              return;
            }
            const hits = source.split(before).length - 1;
            if (hits !== 1) throw new Error(`[phase12.3] ${label}: expected one anchor, found ${hits}`);
            source = source.replace(before, after);
            fs.writeFileSync(file, source);
            console.log(`[phase12.3] applied ${label}`);
          }

          replaceOnce(
            'src/components/DiscoveryEngine.tsx',
            "  'Petroleum & Geoscience',\n  'Renewable Energy',",
            "  'Petroleum & Geoscience',\n  'Geoscience',\n  'Geology',\n  'Organic Geochemistry',\n  'Renewable Energy',",
            'show geoscience subfields in Discover'
          );
          replaceOnce(
            'src/components/DiscoveryEngine.tsx',
            "  'Healthcare',\n  'Public Health',",
            "  'Healthcare',\n  'Health',\n  'Public Health',",
            'show Health in Discover'
          );
          replaceOnce(
            'src/components/DiscoveryEngine.tsx',
            "  'Architecture & Urbanism',\n  'Agriculture & Food',",
            "  'Architecture & Urbanism',\n  'Architecture',\n  'Agriculture & Food',",
            'show Architecture in Discover'
          );
          replaceOnce(
            'src/components/DiscoveryEngine.tsx',
            "  'Government & Policy',\n  'Social Sciences',",
            "  'Government & Policy',\n  'Politics',\n  'Social Sciences',",
            'show Politics in Discover'
          );

          for (const file of [
            'scripts/coverageDrivenCategoryHarvest.mjs',
            'scripts/seedPopularCategoryHardCrawl.mjs',
            'scripts/popularCategoryCoverageReport.mjs',
          ]) {
            replaceOnce(
              file,
              "  'Architecture & Urbanism','Architecture','Agriculture & Food','Law & Regulation','Government & Policy','Social Sciences',",
              "  'Architecture & Urbanism','Architecture','Agriculture & Food','Law & Regulation','Government & Policy','Politics','Social Sciences',",
              `${file}: add Politics to coverage taxonomy`
            );
          }

          replaceOnce(
            'scripts/coverageDrivenCategoryHarvest.mjs',
            "  'Government & Policy':['worldgovernmentsummit.org','milkeninstitute.org','smartcityexpo.com','aspanet.org'],\n  'Social Sciences':",
            "  'Government & Policy':['worldgovernmentsummit.org','milkeninstitute.org','smartcityexpo.com','aspanet.org'],\n  'Politics':['apsanet.org','milkeninstitute.org','worldgovernmentsummit.org','aspanet.org'],\n  'Social Sciences':",
            'add sponsor-capable Politics sources'
          );
          NODE
      - name: Commit taxonomy alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DiscoveryEngine.tsx scripts/coverageDrivenCategoryHarvest.mjs scripts/seedPopularCategoryHardCrawl.mjs scripts/popularCategoryCoverageReport.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Phase 12.3 — Align conference taxonomy across discovery and coverage"
            git push origin HEAD:phase-12-2-community-author-depth
          fi
