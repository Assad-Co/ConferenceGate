name: Phase 56.1 Apply

on:
  push:
    branches:
      - phase-56-1-major-conference-availability

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase56-1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-56-1-major-conference-availability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded availability patch
        run: python scripts/phase56_1_major_availability_patch.py
      - name: TypeScript check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/dataset/staticDataset.ts scripts/runBackgroundBootstrap.mjs
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Phase 56.1 — Guarantee verified major conference availability [phase56-1-applied]"
          git push
