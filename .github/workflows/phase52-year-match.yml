name: Phase 52 Strict Edition Match

on:
  push:
    branches:
      - phase-52-conference-catalogue-history-enrichment

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase52-year-source]') && !contains(github.event.head_commit.message, '[phase52-year-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-52-conference-catalogue-history-enrichment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/phase52_alias_patch.py
      - name: Commit source
        run: |
          git config user.name "ConferenceGate Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server/braveSearch.ts
          git diff --cached --quiet && exit 1
          git commit -m "Phase 52: require matching conference edition year [phase52-year-source]"
          git push origin HEAD:phase-52-conference-catalogue-history-enrichment
