name: Phase 40 Professional Deep Research

on:
  push:
    branches: [phase-40-professional-deep-research]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-40-professional-deep-research
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Phase 40 integration
        run: python3 .github/phase40_patch.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npx tsc -p tsconfig.check.json --noEmit
      - name: Production build
        run: npm run build
      - name: Built server smoke
        run: node scripts/smokeBuiltServer.mjs
      - name: Commit validated Phase 40
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/phase40_patch.py .github/workflows/phase40-professional-deep-research.yml
          git add server/auth.ts server/professionalEvidenceResearchBootstrap.ts src/components/LinkedInProfilePanel.tsx
          git commit -m "Phase 40 — integrate LinkedIn-triggered Professional Deep Research"
          git push origin HEAD:phase-40-professional-deep-research
