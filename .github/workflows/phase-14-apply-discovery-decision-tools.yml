name: Phase 14 Apply Discovery Decision Tools

on:
  push:
    branches: [phase-14-discovery-decision-tools]
    paths:
      - 'scripts/patchPhase14DiscoveryV2.mjs'
      - 'scripts/patchPhase14DetailV2.mjs'
      - '.github/workflows/phase-14-apply-discovery-decision-tools.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-14-discovery-decision-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Discovery decision tools
        run: node scripts/patchPhase14DiscoveryV2.mjs
      - name: Apply conference detail intelligence
        run: node scripts/patchPhase14DetailV2.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DiscoveryEngine.tsx src/components/ExternalConferenceDetail.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Phase 14 — Turn Discovery into a conference decision tool"
            git push origin HEAD:phase-14-discovery-decision-tools
          fi
